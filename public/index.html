<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#ffffff">
<title>Clearer.bc — Background Remover</title>
<style>
*{box-sizing:border-box}
body{margin:0;background:#fff;color:#202124;font-family:Arial,Helvetica,sans-serif}
header{height:70px;border-bottom:1px solid #eee;display:flex;align-items:center;padding:0 6%;font-size:22px;font-weight:700}
.logo{color:#2864e8}
main{max-width:850px;margin:55px auto;padding:0 20px;text-align:center}
h1{font-size:clamp(30px,6vw,48px);letter-spacing:-1.5px;margin:0 0 14px}
.intro{color:#666;font-size:16px;line-height:1.6;margin:0 auto 32px}
.upload{border:2px dashed #c9d2e3;border-radius:16px;padding:35px 18px;background:#fafbfe;cursor:pointer}
.upload:hover{border-color:#2864e8;background:#f5f8ff}
.upload-icon{font-size:38px;color:#2864e8;margin-bottom:12px}
.upload strong{display:block;font-size:18px;margin-bottom:8px}
.upload p{color:#777;font-size:14px}
input[type=file]{display:none}
button{border:0;border-radius:9px;padding:14px 22px;font-size:15px;font-weight:700;cursor:pointer}
button:disabled{opacity:.45;cursor:not-allowed}
.primary{background:#2864e8;color:#fff;width:100%;margin-top:16px}
.secondary{background:#f0f2f5;color:#222;margin-top:12px}
.controls{display:flex;justify-content:center;align-items:center;gap:10px;margin-top:18px;color:#555;font-size:14px}
select{padding:8px;border:1px solid #ddd;border-radius:7px;background:white}
#status{min-height:24px;margin:18px 0;color:#555;font-size:14px;overflow-wrap:anywhere}
#status.error{color:#c62828}
.result{margin-top:25px}
.result img{display:none;max-width:100%;max-height:500px;object-fit:contain;border:1px solid #eee;border-radius:10px;background-color:#f4f4f4;background-image:linear-gradient(45deg,#ddd 25%,transparent 25%),linear-gradient(-45deg,#ddd 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#ddd 75%),linear-gradient(-45deg,transparent 75%,#ddd 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
footer{padding:30px 15px;text-align:center;color:#888;font-size:12px}
@media(min-width:650px){main{margin-top:70px}.upload{padding:48px 25px}}
</style>
</head>
<body>
<header><span class="logo">Clearer</span><span>.bc</span></header>
<main>
<h1>Remove image backgrounds</h1>
<p class="intro">Upload a photo and get a transparent PNG in seconds.</p>

<label class="upload" for="photo">
  <div class="upload-icon">↑</div>
  <strong>Choose an image to upload</strong>
  <p>JPG, PNG or WEBP · Maximum 15 MB</p>
  <span style="color:#2864e8;font-weight:bold">Browse image</span>
</label>
<input id="photo" type="file" accept="image/jpeg,image/png,image/webp">

<div class="controls">
<label for="size">Processing quality</label>
<select id="size">
<option value="320">Faster</option>
<option value="384" selected>Balanced</option>
<option value="512">More detail</option>
</select>
</div>

<button id="remove" class="primary" disabled>Remove background</button>
<div id="status" role="status">Choose an image to get started.</div>

<div class="result">
<img id="preview" alt="Background removed result">
<br>
<button id="download" class="secondary" hidden>Download transparent PNG</button>
</div>
</main>
<footer>Clearer.bc · Simple image background removal</footer>

<script>
const API = 'https://clearer-bc.onrender.com';
const photo = document.getElementById('photo');
const removeBtn = document.getElementById('remove');
const downloadBtn = document.getElementById('download');
const statusBox = document.getElementById('status');
const preview = document.getElementById('preview');
let resultUrl = null;

photo.addEventListener('change', () => {
  const file = photo.files[0];
  preview.style.display = 'none';
  downloadBtn.hidden = true;
  if (resultUrl) URL.revokeObjectURL(resultUrl);
  resultUrl = null;

  if (!file) {
    removeBtn.disabled = true;
    statusBox.textContent = 'Choose an image to get started.';
    return;
  }
  if (!file.type.startsWith('image/') || file.size > 15 * 1024 * 1024) {
    photo.value = '';
    removeBtn.disabled = true;
    statusBox.textContent = 'Choose a valid image smaller than 15 MB.';
    statusBox.className = 'error';
    return;
  }
  removeBtn.disabled = false;
  statusBox.className = '';
  statusBox.textContent = 'Selected: ' + file.name;
});

removeBtn.addEventListener('click', async () => {
  const file = photo.files[0];
  if (!file) return;

  removeBtn.disabled = true;
  removeBtn.textContent = 'Processing…';
  statusBox.className = '';
  statusBox.textContent = 'Processing your image. This may take a little while.';
  downloadBtn.hidden = true;

  const form = new FormData();
  form.append('file', file);
  form.append('size', document.getElementById('size').value);

  try {
    const response = await fetch(API + '/remove-background', {
      method: 'POST',
      body: form
    });

    if (!response.ok) {
      let detail = '';
      try {
        const data = await response.json();
        detail = data.detail || data.error || '';
      } catch (_) {}
      throw new Error('Request failed (HTTP ' + response.status + ')' +
        (detail ? ': ' + detail : ''));
    }

    const blob = await response.blob();
    if (!blob.type.includes('image/png')) {
      throw new Error('The server did not return a PNG image.');
    }

    if (resultUrl) URL.revokeObjectURL(resultUrl);
    resultUrl = URL.createObjectURL(blob);
    preview.src = resultUrl;
    preview.style.display = 'inline-block';
    downloadBtn.hidden = false;
    statusBox.textContent = 'Done! Your transparent image is ready.';
  } catch (error) {
    statusBox.className = 'error';
    statusBox.textContent = error.message +
      '. If the server is waking up, wait a minute and try again.';
  } finally {
    removeBtn.disabled = false;
    removeBtn.textContent = 'Remove background';
  }
});

downloadBtn.addEventListener('click', () => {
  if (!resultUrl) return;
  const a = document.createElement('a');
  a.href = resultUrl;
  a.download = 'clearer-bc-result.png';
  a.click();
});
</script>
</body>
</html>
